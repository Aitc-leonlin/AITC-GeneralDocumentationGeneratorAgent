[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aitc-credit-investigation-chatbot-agent"
version = "0.1.0"
description = "Backend server for the AITC Credit Investigation ChatBot"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "openai",
    "langchain",
    "langsmith",
    "langchain-community",
    "langchain-openai",
    "langchain-ollama",
    "langchain-text-splitters",
    "langchain-chroma",
    "langchain-core",
    "langchain-anthropic",
    "chromadb",
    "torch",
    "transformers",
    "langgraph",
    "langgraph-checkpoint-sqlite>=3,<4",
    "langgraph-checkpoint-postgres>=3,<4",
    "deepagents>=0.7,<0.8",
    "docling[xbrl]>=2.127,<3",
    "defusedxml>=0.7,<1",
    "rpds-py",
    "python-docx",
    "markdown-it-py>=4,<5",
    "python-multipart",
    "python-dotenv>=1,<2",
    "pydantic>=2,<3",
    "pypdf>=5,<7",
    "openpyxl>=3.1,<4",
    "SQLAlchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
namespaces = true
